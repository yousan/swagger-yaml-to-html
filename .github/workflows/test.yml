name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  docker-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t swagger-yaml-to-html .
      - run: python3 -m unittest discover -s tests -v
        env:
          CONVERTER: docker run --rm -i swagger-yaml-to-html

  docker-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile-php -t swagger-yaml-to-html-php .
      - run: python3 -m unittest discover -s tests -v
        env:
          CONVERTER: docker run --rm -i swagger-yaml-to-html-php
